<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>옷미새 - AI 패션 스타일리스트</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        body {
            background-color: #f5f5f7;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 24px;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        header {
            text-align: center;
            padding-bottom: 16px;
            border-bottom: 1px solid #eee;
            margin-bottom: 16px;
        }
        header h1 {
            font-size: 1.5rem;
            color: #1d1d1f;
        }
        header p {
            font-size: 0.9rem;
            color: #86868b;
            margin-top: 4px;
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 4px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .user-message {
            align-self: flex-end;
            background-color: #0071e3;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .bot-message {
            align-self: flex-start;
            background-color: #e9e9eb;
            color: #1d1d1f;
            border-bottom-left-radius: 4px;
        }
        .input-area {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #eee;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #0071e3;
        }
        button {
            padding: 0 20px;
            background-color: #0071e3;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0077ed;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>👔 옷미새 - AI 스타일리스트</h1>
            <p>오늘 뭐 입을지 고민될 땐 언제든 물어보세요!</p>
        </header>
        
        <div class="chat-box" id="chatBox">
            <div class="message bot-message">안녕하세요! 오늘 어떤 날씨나 상황에 맞는 코디가 필요하신가요?</div>
        </div>
        
        <div class="input-area">
            <input type="text" id="userInput" placeholder="예: 오늘 성수동 데이트룩 추천해줘" onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">전송</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        let chatHistory = [];

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user-message');
            userInput.value = '';

            chatHistory.push({ role: 'user', content: text });

            const loadingDiv = appendMessage('AI가 스타일을 추천하는 중입니다...', 'bot-message');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory })
                });

                const data = await response.json();
                
                loadingDiv.remove();
                if (data.reply) {
                    appendMessage(data.reply, 'bot-message');
                    chatHistory.push({ role: 'assistant', content: data.reply });
                } else {
                    appendMessage('답변을 가져오는 중 오류가 발생했습니다.', 'bot-message');
                }
            } catch (error) {
                loadingDiv.remove();
                appendMessage('서버 통신 오류가 발생했습니다. 라이브 상태를 확인하세요.', 'bot-message');
            }
        }

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            
            if (className.includes('bot-message') && text !== 'AI가 스타일을 추천하는 중입니다...') {
                const formattedText = text
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color: #0071e3; text-decoration: underline; font-weight: bold;">$1 🔗</a>');
                div.innerHTML = formattedText;
            } else {
                div.textContent = text;
            }

            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }
    </script>
</body>
</html>
